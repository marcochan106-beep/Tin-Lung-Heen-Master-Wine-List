function navChildren(c){
 if(PRE_SOMMELIER_IDS.has(c.id))return [];
 if(GROUPS[c.id])return GROUPS[c.id];
 // After Sommelier Selection, a page unfolds only when it genuinely has multiple sections.
 if(c.sections.length>1)return c.sections.map(s=>({name:s.name,sections:[s.name]}));
 return [];
}
let openCat='',activeGroup=null;
function navR(){

 const navOrder = [
   'c0', // Wine of the Month
   'c1', // Wines of Asia
   'c2', // Wine by the Glass
   'c6', // Premium Fine Wine Collection
   'c7', // Sommelier Selection
   'c3', // Cocktails, Aperitifs & Digestives
   'c4', // Whiskies
   'c5'  // Beers & Beverages
 ];

 const orderedC = [
   ...navOrder.map(id => C.find(c => c.id === id)),
   ...C.filter(c => !navOrder.includes(c.id))
 ];

 nav.innerHTML=orderedC.map(c=>{const kids=navChildren(c),has=kids.length>0,open=has&&c.id===openCat;
  return `<div class="navgroup"><button data-cat="${c.id}" class="navcat ${c.id===current&&!activeGroup?'active':''}" ${has?`aria-expanded="${open}"`:''}><span>${
  ['Wine of the Month',
   'Wines of Asia',
   'Wine by the Glass',
   'Premium Fine Wine Collection',
   'Sommelier Selection'
  ].includes(c.title)
    ? '<span style="color:#e6c477;margin-right:6px;">★</span>' + esc(c.title)
    : esc(c.title)
}</span>${has?`<span class="chev">${open?'−':'+'}</span>`:''}</button>${has?`<div class="subnav ${open?'show':''}">${kids.map(g=>`<button class="navsub ${c.id===current&&activeGroup===g.name?'active':''}" data-cat="${c.id}" data-group="${esc(g.name)}">${esc(g.name)}</button>`).join('')}</div>`:''}</div>`
 }).join('');
 nav.querySelectorAll('.navcat').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.cat,c=C.find(x=>x.id===id),has=navChildren(c).length>0;current=id;activeGroup=null;q.value='';openCat=has?(openCat===id?'':id):'';navR();render();scrollTo({top:0,behavior:'smooth'})});
 nav.querySelectorAll('.navsub').forEach(btn=>btn.onclick=()=>{current=btn.dataset.cat;openCat=current;activeGroup=btn.dataset.group;q.value='';navR();render();scrollTo({top:0,behavior:'smooth'})});
}
function card(x){return `<article class="wine"><button class="row" aria-expanded="false"><span class="v">${esc(x.v)}</span><span class="name">${esc(x.name)}</span><span class="price">${esc(x.price)}</span><span class="plus">+</span></button><div class="inside">${esc(x.note)}</div></article>`}function bind(){main.querySelectorAll('.row').forEach(b=>b.onclick=()=>{const a=b.closest('.wine'),o=a.classList.toggle('open');b.setAttribute('aria-expanded',o)})}function render(){const query=q.value.trim().toLowerCase();if(query){let groups=[];C.forEach(c=>c.sections.forEach(s=>{let items=s.items.filter(x=>(c.title+' '+s.name+' '+x.v+' '+x.name+' '+x.price).toLowerCase().includes(query));if(items.length)groups.push({title:c.title+' · '+s.name,items})}));let count=groups.reduce((a,g)=>a+g.items.length,0);st.textContent='Search results';meta.textContent='621 wines · Updated '+updated;main.innerHTML=`<section class="hero"><div class="kicker">Search</div><h2>${esc(q.value)}</h2><p>${count} matching selections</p></section>`+(groups.length?groups.map(g=>`<section class="section"><h3>${esc(g.title)}</h3>${g.items.map(card).join('')}</section>`).join(''):'<div class="empty">No matching selection found.</div>');bind();return}let c=C.find(x=>x.id===current)||C[0];st.textContent=c.title;meta.textContent='621 wines · Updated '+updated;let group=activeGroup?navChildren(c).find(g=>g.name===activeGroup):null;let sections=group?c.sections.filter(s=>group.sections.includes(s.name)):c.sections;main.innerHTML=`<section class="hero"><div class="kicker">Tin Lung Heen${group?' · '+esc(c.title):''}</div><h2>${esc(group?group.name:c.title)}</h2></section>`+sections.map(s=>`<section class="section"><h3>${esc(s.name)}</h3>${s.items.map(card).join('')}</section>`).join('')+`<div class="legal">All prices are in HK$ and subject to 10% service charge. All wines are inspected for quality. Wines priced over HK$10,000 are sold "AS-IS"; no return or refund after the wine is opened.</div>`;bind()}q.oninput=render;navR();render();
</script></body></html>
